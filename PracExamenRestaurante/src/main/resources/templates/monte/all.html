<!DOCTYPE html>
<html lang="en" xmlns:th="https://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Montes</title>
    <link rel="stylesheet" href="/css/all.css">
    <link rel="icon" type="image/png" th:href="@{/images/IconoSummitrack.png}">
</head>
<body>

    <div th:insert="fragments/header :: header"></div>

<h1>Montes</h1>
    <table>
        <tr>
            <th>Nombre</th>
            <th>Altura</th>
            <th>Ubicacion</th>
            <th>Apuntes</th>
            <th>Num ascensiones</th>
            <th>Ver rutas</th>
            <th class="btnOpciones">Editar</th>
            <th class="btnOpciones">Eliminar</th>

        </tr>
        <tr th:each="monte : ${montes}">
            <td th:text="${monte.nombre}"></td>
            <td th:text="${monte.altura}"></td>
            <td th:text="${monte.ubicacion}"></td>
            <td th:text="${monte.apuntes}"></td>
            <td><p th:text="'Numero: ' + ${monte.asciende.size()}"></p></td>
            <td><a th:href="|/monte/rutas?id=${monte.id}|">Ver rutas</a></td>
            <td><a th:href="|/monte/add?id=${monte.id}|" id="btnEditar">Editar</a></td>
            <td><a th:href="|/monte/eliminar?id=${monte.id}|" id="btnEliminar">Eliminar</a></td>
        </tr>
    </table>
    <div class="buttons-container">
        <a th:href="|/monte/add?|">Añadir</a>
        <a th:href="|/|">Salir</a>
    </div>
</body>
</html>
