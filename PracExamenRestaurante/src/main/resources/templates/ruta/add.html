<!DOCTYPE html>
<html lang="en" xmlns:th="https://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Summitrack</title>
    <link rel="stylesheet" href="/css/add.css">
    <link rel="icon" type="image/png" th:href="@{/images/logo.png}">
</head>
<body>
<header>
    <a href="/monte">Montes</a>
    <a href="/ruta">Rutas</a>
    <a href="/calendario">Calendario</a>
</header>

    <form action="#" th:action="@{/ruta/add}" th:object="${ruta}" method="post" enctype="multipart/form-data">


        <input type="hidden" th:if="${editar}" th:field="*{id}" /> <!-- Los inputs disabled no envian informacion, por lo que si esta disables hago esta trampa para enviar informacion. Si no matricula seria null-->

        <p>Distancia: <input type="number" th:field="*{distancia}"/></p>

        <p>Desnivel: <input type="number" th:field="*{desnivel}"/></p>

        <p>Fecha: <input type="date" th:field="*{fecha}" required/></p>

        <p>Tiempo: <input type="number" th:field="*{tiempo}" required/></p>

        <p>Tipo: <input type="text" th:field="*{tipo}" required/></p>

        <p>Dificultad: <input type="number" th:field="*{dificultad}" required/></p>

        <p>Peligrosidad: <input type="number" th:field="*{peligrosidad}" required/></p>

<!--        <p>Foto: <input type="file" name="foto" required/></p>-->

        <p>Monte:
            <select th:field="*{monte}" required>
                <option value="">-- Selecciona un monte --</option>
                <option th:each="monte : ${montes}"
                        th:value="${monte.id}"
                        th:text="${monte.nombre}"></option>
            </select>
        </p>

<!--        <select name="idConductor">-->
<!--            <option th:each="cond : ${conductores}"-->
<!--                    th:text="${cond.nombre}"-->
<!--                    th:value="${cond.carnet}"/>-->
<!--        </select>-->

<!--        <p>Trayecto: <input type="text" name="trayecto"/></p>-->
        <button type="submit" class="btn btn-primary">Guardar</button>
    </form>
<div class="buttons-container">
    <a th:href="|/ruta|">Salir</a>
</div>
</body>
</html>
