<!DOCTYPE html>
<html lang="es" xmlns:th="https://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Detalles de la Ruta</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 flex justify-center items-center min-h-screen">
<header>
    <a href="/monte">Montes</a>
    <a href="/ruta">Rutas</a>
    <a href="/personas">Personas</a>
    <a href="/calendario">Calendario</a>
    <a href="/mendiklopedia">Mendiklopedia</a>
    <a href="/top">TOP</a>
</header>

<div class="bg-white shadow-lg rounded-lg p-8 max-w-3xl w-full">
    <h1 class="text-3xl font-bold text-center text-gray-800 mb-6">Detalles de la Ruta</h1>

    <div class="grid grid-cols-2 gap-4">
        <div><strong>Distancia:</strong> <span th:text="${ruta.distancia}"></span> km</div>
        <div><strong>Desnivel:</strong> <span th:text="${ruta.desnivel}"></span> m</div>
        <div><strong>Fecha:</strong> <span th:text="${ruta.fecha}"></span></div>
        <div><strong>Tiempo:</strong> <span th:text="${ruta.tiempo}"></span> min</div>
        <div><strong>Tipo:</strong> <span th:text="${ruta.tipo}"></span></div>
        <div><strong>Peligrosidad:</strong> <span th:text="${ruta.peligrosidad}"></span>/10</div>
        <div><strong>Dificultad:</strong> <span th:text="${ruta.dificultad}"></span>/10</div>
        <div><strong>Monte:</strong> <span th:text="${ruta.monte != null ? ruta.monte.nombre : 'Sin Monte'}"></span></div>
    </div>

<!--    <div class="mt-6 text-center">-->
<!--        <img th:src="@{/ruta/foto(id=${ruta.id})}" alt="Imagen de la ruta" class="rounded-lg shadow-md mx-auto w-80 h-48 object-cover">-->
<!--    </div>-->

    <div class="flex justify-between mt-6">
        <a th:href="|/ruta/add?id=${ruta.id}|" class="bg-blue-500 text-white px-4 py-2 rounded-md hover:bg-blue-600">✏️ Editar</a>
        <a th:href="|/ruta/eliminar?id=${ruta.id}|" class="bg-red-500 text-white px-4 py-2 rounded-md hover:bg-red-600">🗑️ Eliminar</a>
        <a th:href="@{/}" class="bg-gray-500 text-white px-4 py-2 rounded-md hover:bg-gray-600">⬅️ Volver</a>
    </div>
</div>

</body>
</html>
