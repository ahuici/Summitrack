<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.w3.org/1999/xhtml">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Summitrack</title>
  <link href="/css/all.css" rel="stylesheet">
</head>
<body>
  <header>
    <a href="/monte">Montes</a>
    <a href="/ruta">Rutas</a>
    <a href="/calendario">Calendario</a>
    <a href="/mendiklopedia">Mendiklopedia</a>
    <a href="/top">TOP</a>
  </header>

  <a href="/mendiklopedia" class="atras">← Atras</a>
<h1 th:text="${nombreOpcion}"></h1>

  <div class="ordenar">
    <a th:href="@{'/mendiklopedia/' + ${url} + '?campo=nombre&orden=asc'}">Nombre asc</a>
    <a th:href="@{'/mendiklopedia/' + ${url} + '?campo=nombre&orden=desc'}">Nombre desc</a>
    <a th:href="@{'/mendiklopedia/' + ${url} + '?campo=altura&orden=asc'}">Altura asc</a>
    <a th:href="@{'/mendiklopedia/' + ${url} + '?campo=altura&orden=desc'}">Altura desc</a>
  </div>
<table>
  <tr>
    <th>Nombre</th>
    <th>Provincia</th>
    <th>Altura</th>
  </tr>
  <!-- Iterar sobre los montes -->
    <tr th:each="monte : ${montes}">
      <td th:text="${monte.nombre}"></td>
      <td th:text="${monte.provincia}"></td>
      <td th:text="${monte.altura}"></td>
    </tr>
</table>
</body>
</html>
