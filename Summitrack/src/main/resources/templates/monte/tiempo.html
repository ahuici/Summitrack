<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="UTF-8">
    <title>Summitrack</title>
    <link rel="stylesheet" href="/css/all.css">
    <link rel="icon" type="image/png" th:href="@{/images/IconoSummitrack.png}">
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gradient-to-b from-blue-100 to-white min-h-screen p-8">

<div th:insert="fragments/header :: header"></div>

<h1 class="text-3xl font-bold text-center text-gray-800 mb-6" th:text="${monte.nombre}">Nombre del Monte</h1>

<div class="max-w-6xl mx-auto">
    <h2 class="text-4xl font-bold text-center text-blue-800 mb-10">🌄 Pronóstico del Tiempo por Día</h2>

    <!-- Bucle por días -->
    <div th:each="grupoDia : ${tiemposAgrupadosPorDia}" class="mb-12">
        <h3 class="text-2xl font-semibold text-blue-700 mb-4 border-b border-blue-300 pb-1">
            Día <span th:text="${grupoDia.key}">12/04</span>
        </h3>

        <div class="overflow-x-auto shadow-lg rounded-2xl bg-white">
            <table class="min-w-full text-center">
                <thead class="bg-blue-700 text-white">
                <tr>
                    <th class="px-4 py-3">Hora</th>
                    <th class="px-4 py-3">🌡️ Temperatura</th>
                    <th class="px-4 py-3">🌧️ Prob. lluvia</th>
                    <th class="px-4 py-3">💨 Racha viento</th>
                    <th class="px-4 py-3">❄️ Preci. nieve</th>
                    <th class="px-4 py-3">🏔️ Nieve acumulada</th>
                </tr>
                </thead>
                <tbody class="divide-y divide-gray-200" th:each="tiempo : ${grupoDia.value}">
                <tr class="hover:bg-blue-50 transition">
                    <td class="px-4 py-2" th:text="${tiempo.hora}">--</td>
                    <td class="px-4 py-2" th:text="${tiempo.temperatura}">--</td>
                    <td class="px-4 py-2" th:text="${tiempo.probLluvia}">--</td>
                    <td class="px-4 py-2" th:text="${tiempo.viento}">--</td>
                    <td class="px-4 py-2" th:text="${tiempo.precipitacionNieve}">--</td>
                    <td class="px-4 py-2" th:text="${tiempo.nieveAcumulada}">--</td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
</body>
</html>
