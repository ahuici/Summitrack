<!DOCTYPE html>
<html lang="en" xmlns:th="https://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Summitrack</title>
  <link rel="stylesheet" href="/css/add.css">
  <link rel="icon" type="image/png" th:href="@{/images/IconoSummitrack.png}">
</head>
<body>
  <div th:insert="fragments/header :: header"></div>


<form action="#" th:action="@{/personas/add}" th:object="${persona}" method="post" enctype="multipart/form-data">


  <input type="hidden" th:if="${editar}" th:field="*{id}" /> <!-- Los inputs disabled no envian informacion, por lo que si esta disables hago esta trampa para enviar informacion. Si no matricula seria null-->

  <p>Nombre: <input type="text" th:field="*{nombre}"/></p>

  <p>Apellidos: <input type="text" th:field="*{apellidos}"/></p>

  <p>Genero:
    <select name="personas" id="personas" required>
      <option value="">-- Selecciona un genero --</option>
      <option th:value="hombre">Hombre</option>
      <option th:value="mujer">Mujer</option>
      <option th:value="otro">Otro</option>
    </select>
  </p>

  <p>Edad: <input type="number" th:field="*{edad}" required/></p>

  <button type="submit" class="btn btn-primary">Guardar</button>
</form>
<div class="buttons-container">
  <a th:href="|/personas|">Salir</a>
</div>
</body>
</html>
