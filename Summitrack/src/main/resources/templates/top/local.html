<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="UTF-8">
    <title>Summitrack</title>
    <link rel="stylesheet" href="/css/top.css">
    <link rel="icon" type="image/png" th:href="@{/images/IconoSummitrack.png}">
</head>
<body>

  <div th:insert="fragments/header :: header"></div>

  <div id="distancia">
    <h1>DISTANCIA</h1>
    <table>
      <tr class="cabecera">
        <th>Nombre</th>
        <th>Dist.</th>
      </tr>
      <tr th:each="distancia : ${distancias}">
        <td th:text="${distancia.nombre}"></td>
        <td th:text="${distancia.distancia}"></td>
      </tr>
    </table>
  </div>

  <div id="desnivel">
    <H1>DESNIVEL</H1>
    <table>
      <tr class="cabecera">
        <th>Nombre</th>
        <th>Desn.</th>
      </tr>
      <tr th:each="desnivel : ${desniveles}">
        <td th:text="${desnivel.nombre}"></td>
        <td th:text="${desnivel.desnivel}"></td>
      </tr>
    </table>
  </div>

  <div id="cimas">
    <h1>CIMAS</h1>
    <table>
      <tr class="cabecera">
        <th>Nombre</th>
        <th>Cimas.</th>
      </tr>
      <tr th:each="cima : ${cimas}">
        <td th:text="${cima.nombre}"></td>
        <td th:text="${cima.cimas}"></td>
      </tr>
    </table>
  </div>

</body>
</html>
